<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1e2e"/>
      <stop offset="1" stop-color="#14141f"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="128" height="128" rx="26" fill="url(#bg)"/>

  <!-- twin overlapping circles: two independent histories, one shared tree -->
  <circle cx="48" cy="66" r="34" fill="#F05033" opacity="0.88"/>
  <circle cx="80" cy="66" r="34" fill="#2EC4B6" opacity="0.88"/>

  <!-- git branch/fork glyph centered in the overlap -->
  <g stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" fill="none">
    <line x1="64" y1="38" x2="64" y2="58"/>
    <line x1="64" y1="58" x2="52" y2="82"/>
    <line x1="64" y1="58" x2="76" y2="82"/>
  </g>
  <circle cx="64" cy="34" r="6.5" fill="#ffffff"/>
  <circle cx="52" cy="86" r="6.5" fill="#ffffff"/>
  <circle cx="76" cy="86" r="6.5" fill="#ffffff"/>
</svg>
